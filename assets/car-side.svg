<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <!-- ПЛЕЙСХОЛДЕР: замените на фото автомобиля (PNG с прозрачным фоном, те же пропорции) -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d42"/>
      <stop offset=".35" stop-color="#16181b"/>
      <stop offset=".7" stop-color="#0b0c0e"/>
      <stop offset="1" stop-color="#1d1f22"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c4cf"/>
      <stop offset="1" stop-color="#6b7580"/>
    </linearGradient>
    <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".85"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2a2c30"/>
      <stop offset=".8" stop-color="#121315"/>
      <stop offset="1" stop-color="#3a3c40"/>
    </radialGradient>
  </defs>

  <ellipse cx="405" cy="262" rx="380" ry="16" fill="url(#shadow)"/>

  <!-- Кузов -->
  <path d="M50,215 L130,215 A55,55 0 0 1 240,215 L570,215 A55,55 0 0 1 680,215 L750,215
           C762,215 768,205 766,190 L760,160 C758,148 748,140 730,138 L650,132
           C610,100 570,78 520,72 L360,70 C320,72 285,95 250,130 L120,145
           C80,150 52,160 46,178 L44,200 C44,210 46,215 50,215 Z" fill="url(#body)"/>

  <!-- Стёкла (без тонировки) + силуэты подголовников -->
  <path d="M268,132 C295,105 325,86 362,82 L438,82 L438,132 Z" fill="url(#glass)"/>
  <path d="M450,82 L515,82 C548,86 575,105 598,128 L450,132 Z" fill="url(#glass)"/>
  <rect x="392" y="100" width="26" height="32" rx="9" fill="#2b3036" opacity=".55"/>
  <rect x="500" y="102" width="24" height="30" rx="9" fill="#2b3036" opacity=".55"/>
  <path d="M438,82 L450,82 L450,132 L438,132 Z" fill="#0a0b0c"/>

  <!-- Линии кузова -->
  <path d="M250,134 L640,134" stroke="#5a5e64" stroke-width="2" opacity=".6"/>
  <path d="M120,160 C300,150 520,150 745,158" stroke="#4a4e54" stroke-width="1.5" fill="none" opacity=".5"/>
  <path d="M444,136 L444,212 M600,136 L604,212" stroke="#000" stroke-width="2" opacity=".7"/>
  <rect x="400" y="148" width="26" height="5" rx="2.5" fill="#4b4f55"/>
  <rect x="548" y="148" width="26" height="5" rx="2.5" fill="#4b4f55"/>
  <!-- Зеркало -->
  <path d="M262,128 L288,122 L292,136 L266,140 Z" fill="#0d0e10" stroke="#3a3d42"/>
  <!-- Фара и фонарь -->
  <path d="M50,170 C60,160 85,154 112,152 L108,164 C88,166 66,170 50,176 Z" fill="#e8f0ff" opacity=".9"/>
  <path d="M740,146 L762,152 L764,168 L742,164 Z" fill="#ff1a1a"/>
  <path d="M60,205 L120,205" stroke="#ff1a1a" stroke-width="2" opacity=".35"/>

  <!-- Колёса -->
  <g id="wheel-f">
    <circle cx="185" cy="218" r="48" fill="#0b0b0c"/>
    <circle cx="185" cy="218" r="34" fill="url(#rim)"/>
    <path d="M168,200 L176,195 L184,208 Z" fill="#e60000"/>
    <g stroke="#55585e" stroke-width="3">
      <path d="M185,186 L185,250 M153,218 L217,218 M162,195 L208,241 M208,195 L162,241"/>
    </g>
    <circle cx="185" cy="218" r="7" fill="#2a2c30" stroke="#666" />
  </g>
  <g>
    <circle cx="625" cy="218" r="48" fill="#0b0b0c"/>
    <circle cx="625" cy="218" r="34" fill="url(#rim)"/>
    <path d="M608,200 L616,195 L624,208 Z" fill="#e60000"/>
    <g stroke="#55585e" stroke-width="3">
      <path d="M625,186 L625,250 M593,218 L657,218 M602,195 L648,241 M648,195 L602,241"/>
    </g>
    <circle cx="625" cy="218" r="7" fill="#2a2c30" stroke="#666" />
